<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Product Inventory & Analytics Dashboard</title>
</head>
<body>
    <div class="container">

        <header>
            <h1>📦Product Inventory Dashboard</h1>
            <p>Manage products, monitor inventory value, and explore
                your business analytics.</p>
        </header>
        <section class="stats">
            <div class="card">
                <p class="stat-label">Total Products</p>
                <div class="stat-value" id="productCount">0</div>
            </div>

            <div class="card">
                <p class="stat-label">Total Inventory Value</p>
                <div class="stat-value" id="totalValue">$0.00</div>
            </div>

            <div class="card">
                <p class="stat-label">Affordable Products</p>
                <div class="stat-value" id="affordableCount">0</div>
                <p class="stat-label">Price under $200</p>
            </div>
        </section>

    <link rel="stylesheet" href="styles.css">
    <script src="App.js"></script>
</body>
</html>
